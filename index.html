<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Fernrel</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: a lightless undercity. Cobblestone ground, slate panels, the Storm's violet lightning seeping through the cracks and arcing between boxes. */
:root {
  --bg: #121017;
  --panel: rgba(27, 24, 35, .95);
  --ink: #ece8f4;
  --muted: #a49db8;
  --line: #3a3448;
  --accent: #b48cff;
  --accent-soft: #33274a;
  --side: #0b0910;
  --side-ink: #ddd6ee;
  --side-muted: #8a83a0;
  --trance: #6cb8ff;
  --good: #6fd19c;
  --bad: #ff8a80;
  --bolt: #c9a6ff;
  --bolt-glow: rgba(150, 90, 255, .55);
  --display: "Marcellus", "Cinzel", Georgia, serif;
  --body: "Alegreya", Georgia, "Times New Roman", serif;
  --ui: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background-color: var(--bg); background-image: var(--cobble, none); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.5; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.shell { display: grid; grid-template-columns: 230px minmax(0, 1fr); min-height: 100%; }
.side {
  background-color: var(--side);
  background-image:
    radial-gradient(1px 1px at 22px 40px, #fff9 50%, transparent 51%),
    radial-gradient(1px 1px at 160px 90px, #fff7 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 90px 170px, #c9a6ffaa 50%, transparent 51%),
    radial-gradient(1px 1px at 200px 260px, #fff6 50%, transparent 51%),
    radial-gradient(1px 1px at 40px 330px, #fff8 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 180px 420px, #fff5 50%, transparent 51%),
    radial-gradient(1px 1px at 70px 520px, #c9a6ff99 50%, transparent 51%);
  background-size: 230px 600px;
  color: var(--side-ink);
  border-right: 1px solid #2a2238; box-shadow: 1px 0 24px -6px var(--bolt-glow);
  padding: 28px 16px;
  position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; align-self: start;
  display: flex; flex-direction: column; gap: 24px;
}
.brand { padding-inline: 10px; }
.brand .who { font-family: var(--display); font-size: 1.5rem; line-height: 1.15; text-wrap: balance; color: #f4f1ff; text-shadow: 0 0 14px var(--bolt-glow); }
.brand .what { font-family: var(--ui); font-size: .82rem; color: var(--side-muted); margin-top: 4px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button {
  background: none; border: 0; text-align: left; padding: 9px 12px; border-radius: 6px;
  font-family: var(--ui); font-size: .98rem; color: var(--side-ink); display: flex; justify-content: space-between; align-items: baseline;
}
.nav button small { color: var(--side-muted); font-size: .75rem; }
.nav button:hover { background: #ffffff10; }
.nav button[aria-current="page"] { background: #b48cff1f; color: #e6d7ff; box-shadow: inset 2px 0 0 var(--accent); }
.side-foot { margin-top: auto; font-family: var(--ui); font-size: .78rem; color: var(--side-muted); padding-inline: 10px; }

.main { min-width: 0; padding: 24px clamp(16px, 4vw, 48px) 120px; }
.topbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.title-row { display: flex; align-items: center; gap: 14px; min-width: 0; }
.btn.menu { min-height: 40px; padding: 6px 14px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.shell.closed { grid-template-columns: minmax(0, 1fr); }
.shell.closed .side { display: none; }
.topbar h1 { font-family: var(--display); font-weight: 400; font-size: 1.9rem; margin: 0; text-wrap: balance; }
.tools { display: flex; flex-wrap: nowrap; gap: 10px; align-items: center; font-family: var(--ui); position: relative; flex: 1 1 auto; justify-content: flex-end; min-width: 0; }
.status { font-size: .8rem; color: var(--muted); position: absolute; top: calc(100% + 4px); right: 0; white-space: nowrap; }
.status.err { color: var(--bad); }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 6px 14px; font-family: var(--ui); font-size: .92rem; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--panel); border-color: var(--accent); font-weight: 700; }
.btn.rest { min-height: 40px; }
.btn.rest.armed { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 14px -4px var(--bolt-glow); }
.actions { display: flex; gap: 10px; flex-wrap: nowrap; align-items: center; }
.search { position: relative; flex: 1 1 200px; min-width: 110px; max-width: 320px; }
#f-search { width: 100%; min-height: 40px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); font-family: var(--ui); font-size: .95rem; }
#f-search:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 12px -4px var(--bolt-glow); }
#f-search::placeholder { color: var(--muted); }
.results { position: absolute; top: calc(100% + 6px); right: 0; width: min(420px, calc(100vw - 32px)); max-height: 60vh; overflow-y: auto; background: #1b1824; border: 1px solid var(--accent); border-radius: 8px; box-shadow: 0 12px 32px -10px #000c, 0 0 18px -8px var(--bolt-glow); z-index: 55; padding: 4px; }
.result { display: grid; gap: 2px; width: 100%; text-align: left; background: none; border: 0; border-radius: 6px; padding: 8px 10px; }
.result:hover, .result:focus-visible { background: var(--accent-soft); }
.r-title { font-family: var(--body); font-weight: 700; font-size: 1.02rem; color: var(--ink); }
.r-where { font-family: var(--ui); font-size: .75rem; color: var(--accent); text-transform: uppercase; letter-spacing: .06em; }
.r-snip { font-family: var(--ui); font-size: .85rem; color: var(--muted); }
.r-none { padding: 10px; font-family: var(--ui); color: var(--muted); }
@keyframes found { 0%, 60% { box-shadow: 0 0 0 2px var(--bolt), 0 0 28px 4px var(--bolt-glow); } 100% { box-shadow: 0 0 0 0 transparent; } }
.found { animation: found 2.4s ease-out; border-radius: 8px; }
.btn.small { padding: 3px 10px; font-size: .82rem; }
.btn.ghost { background: none; }
.x { border: 0; background: none; color: var(--muted); font-family: var(--ui); font-size: .82rem; padding: 2px 6px; }
.x:hover { color: var(--bad); }
.editing-banner { font-family: var(--ui); font-size: .85rem; background: var(--accent-soft); color: var(--ink); border-radius: 6px; padding: 8px 12px; margin-bottom: 18px; }

/* editable text */
.ed { white-space: pre-wrap; overflow-wrap: anywhere; min-width: 1ch; }
.ed:empty::before { content: attr(data-ph); color: var(--muted); opacity: .6; font-style: italic; }
.editing .ed[contenteditable] { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); border-radius: 3px; box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent); cursor: text; }
.editing .ed.multi[contenteditable] { display: block; min-height: 2.6em; padding: 4px 6px; }
.editing .ed[contenteditable]:focus { outline: 2px solid var(--accent); }
input.num { width: 3.2em; text-align: center; border: 1px solid transparent; background: transparent; border-radius: 4px; font-variant-numeric: tabular-nums; -moz-appearance: textfield; }
input.num::-webkit-inner-spin-button, input.num::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input.num::placeholder { color: var(--muted); opacity: .6; }
input.num:not([readonly]) { border-color: var(--line); background: var(--panel); }
.editing input.num:not([readonly]) { box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent); }
input.num[readonly] { pointer-events: none; }

.label { font-family: var(--ui); font-size: .72rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
h2 { font-family: var(--display); font-weight: 400; font-size: 1.35rem; margin: 0; }
h3 { font-family: var(--display); font-weight: 400; font-size: 1.1rem; margin: 0; }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.empty { color: var(--muted); font-style: italic; }

/* character sheet */
.idband { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px 20px; margin-bottom: 18px; }
.idband > div { border-bottom: 1px solid var(--line); padding-bottom: 4px; min-width: 0; }
.idband .ed { display: block; font-size: 1.05rem; }
.sheet { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.col-a { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 14px; align-items: start; }
.abil { display: flex; flex-direction: column; gap: 10px; }
.ab { background: var(--panel); border: 1px solid var(--line); border-radius: 10px 10px 30px 30px / 10px 10px 18px 18px; text-align: center; padding: 6px 4px 8px; }
.ab .label { font-size: .64rem; }
.ab .mod { font-family: var(--display); font-size: 1.75rem; line-height: 1.2; font-variant-numeric: tabular-nums; }
.ab input.num { width: 3em; font-family: var(--ui); font-size: .9rem; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); }
.pill-row { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
.pill-row .big { font-family: var(--display); font-size: 1.3rem; min-width: 2.2ch; text-align: center; font-variant-numeric: tabular-nums; }
.pill-row input.num { font-family: var(--display); font-size: 1.3rem; width: 2.4em; }
.checks { display: flex; flex-direction: column; gap: 1px; }
.check { display: grid; grid-template-columns: 18px 2.4em minmax(0, 1fr) auto; align-items: center; gap: 6px; font-size: .95rem; padding: 1px 0; }
.check .val { font-variant-numeric: tabular-nums; text-align: right; font-family: var(--ui); }
.check .ft { font-family: var(--ui); font-size: .74rem; color: var(--accent); white-space: nowrap; display: inline-block; }
.check .sk-name { min-width: 0; overflow-wrap: break-word; }
.check.sk { grid-template-columns: 18px 2.4em minmax(0, 1fr) auto; }
.check .ab-tag { font-family: var(--ui); font-size: .72rem; color: var(--muted); }
.dot { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--muted); background: none; padding: 0; }
.dot.on { background: var(--accent); border-color: var(--accent); }
.dot.ex { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 2px var(--panel), 0 0 0 3.5px var(--accent); }
.dot:disabled { cursor: default; }
.dot.tr { background: var(--trance); border-color: var(--trance); box-shadow: 0 0 8px -1px var(--trance); }
.dot.pick:hover { border-color: var(--trance); }
.box-title { text-align: center; margin-top: 8px; }

.quick { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
.qt { display: flex; align-items: center; gap: 16px; background: var(--panel); border: 1px solid var(--accent); border-radius: 10px; padding: 10px 16px; box-shadow: 0 6px 20px -14px var(--accent); flex: 1 1 260px; justify-content: space-between; }
.qt-name { font-family: var(--display); font-size: 1.25rem; line-height: 1.2; }
.qt .pip { width: 26px; height: 26px; border-width: 2px; }
.qt .pips { gap: 8px; }
.vitals { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.vital { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; text-align: center; padding: 8px 4px; }
.vital .v { font-family: var(--display); font-size: 1.6rem; line-height: 1.25; }
.vital input.num { font-family: var(--display); font-size: 1.6rem; width: 2.6em; }
.vital .ed { font-family: var(--display); font-size: 1.3rem; display: block; line-height: 1.6; }
.shield { border-radius: 8px 8px 50% 50% / 8px 8px 30% 30%; }
.hp { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.hp .cur { grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center; }
.hp-row { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
.delta { display: flex; align-items: center; gap: 6px; font-family: var(--display); font-size: 1.5rem; line-height: 1; }
.delta.dmg { color: var(--bad); }
.delta.heal { color: var(--good); }
.delta-in { width: 4.2em; min-height: 40px; text-align: center; font-family: var(--ui); font-size: 1.05rem; color: var(--ink); background: var(--bg); border: 1.5px solid currentColor; border-radius: 8px; padding: 4px 6px; -moz-appearance: textfield; }
.delta-in::-webkit-inner-spin-button, .delta-in::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.delta.dmg .delta-in { border-color: color-mix(in srgb, var(--bad) 70%, transparent); }
.delta.heal .delta-in { border-color: color-mix(in srgb, var(--good) 70%, transparent); }
.delta-in::placeholder { color: var(--muted); opacity: .7; }
.hp .cur input.num { font-family: var(--display); font-size: 2.4rem; width: 3em; }
.hp .max { font-family: var(--ui); font-size: .85rem; color: var(--muted); display: flex; align-items: center; gap: 4px; }
.hp .max input.num { width: 2.6em; }
.hp .sub { display: flex; flex-direction: column; align-items: center; }
.hp .sub input.num { font-family: var(--display); font-size: 1.4rem; width: 2.6em; }
.hpbar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; width: 100%; margin-top: 6px; }
.hpbar span { display: block; height: 100%; background: var(--good); }
.pips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.pip { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--accent); background: var(--accent); padding: 0; }
.pip.spent { background: transparent; border-color: var(--muted); opacity: .7; }
.pip.mark { background: transparent; border-color: var(--muted); }
.pip.mark.succ.on { background: var(--good); border-color: var(--good); }
.pip.mark.fail.on { background: var(--bad); border-color: var(--bad); }
.ac-note { padding-inline: 4px; }
.vital .ac-note .ed { font-family: var(--ui); font-size: .74rem; color: var(--muted); line-height: 1.25; display: inline; }
.cond-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.cond { font-family: var(--ui); font-size: .8rem; padding: 4px 10px; min-height: 32px; border-radius: 999px; border: 1px solid var(--line); background: none; color: var(--muted); }
.cond.on { background: var(--bad); border-color: var(--bad); color: #1a0f12; font-weight: 700; }
.exh-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.pip.mark.exh.on { background: var(--bad); border-color: var(--bad); }
.cond-fx { margin: 10px 0 0; padding-left: 18px; font-size: .9rem; display: grid; gap: 4px; }
.cond-fx b { color: var(--bad); }
.ds { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: center; font-family: var(--ui); font-size: .9rem; }

table { border-collapse: collapse; width: 100%; }
th { font-family: var(--ui); font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 500; text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); }
td { padding: 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.n { font-variant-numeric: tabular-nums; }
.tablewrap { overflow-x: auto; }
.trait-box .ed { display: block; }
.ed.live { display: block; border-bottom: 1px dashed var(--line); min-height: 1.6em; cursor: text; }
.ed.live:focus { outline: none; border-bottom-color: var(--accent); }
.trance { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.defenses { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.trait-box + .trait-box { margin-top: 0; }
.see { font-family: var(--ui); font-size: .85rem; color: var(--muted); }
.link { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; font-family: var(--ui); }

/* spells */
.casting { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 18px; }
.casting .vital select { border: 1px solid var(--line); background: var(--panel); border-radius: 4px; font-family: var(--display); font-size: 1.2rem; }
.lvltabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; }
.lvltabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 14px; font-family: var(--display); font-size: 1.05rem; color: var(--muted); white-space: nowrap; }
.lvltabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.lvltabs small { font-family: var(--ui); font-size: .75rem; margin-left: 4px; }
.slotrow { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 16px; font-family: var(--ui); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 400px), 1fr)); gap: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.card-head h3 { font-size: 1.4rem; }
.meta { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 12px; font-family: var(--ui); font-size: 1rem; }
.meta dt { color: var(--muted); }
.meta dd { margin: 0; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-family: var(--ui); font-size: .72rem; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: none; }
.tag.on { border-color: var(--accent); color: var(--accent); }
.tag.src { background: var(--accent-soft); border-color: transparent; color: var(--ink); }
.card .text { font-size: 1.15rem; line-height: 1.55; }
.card .tag { font-size: .85rem; padding: 2px 10px; }
.card.fav { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 6px 20px -12px var(--accent); }
.tag.fav.on { background: var(--accent); border-color: var(--accent); color: var(--panel); font-weight: 700; }

/* features */
.jump { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
.jump button { font-family: var(--ui); font-size: .85rem; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 3px 12px; }
.group { margin-bottom: 22px; scroll-margin-top: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px clamp(14px, 3vw, 24px); }
/* The Storm's section: the corruption crawls along its edges */
.group.storm-box { position: relative; border-color: #8f5cff; background: radial-gradient(ellipse at 20% 0%, rgba(120, 60, 230, .2), transparent 60%), radial-gradient(ellipse at 100% 100%, rgba(90, 30, 180, .16), transparent 55%), var(--panel); animation: storm-pulse 5.3s infinite; }
.storm-box > :not(.sb-canvas) { position: relative; z-index: 1; }
.sb-canvas { position: absolute; left: -26px; top: -26px; width: calc(100% + 52px); height: calc(100% + 52px); pointer-events: none; z-index: 0; }
.storm-box .group-head h2 { color: #efe4ff; text-shadow: 0 0 12px #a46bff, 0 0 2px #fff; animation: storm-title 6.1s infinite; }
@keyframes storm-pulse {
  0%, 100% { box-shadow: 0 0 0 1px #8f5cff55, 0 0 26px -6px var(--bolt-glow), inset 0 0 38px -12px rgba(130, 70, 255, .35); }
  6% { box-shadow: 0 0 0 1px #c9a6ff, 0 0 44px -2px var(--bolt-glow), inset 0 0 50px -8px rgba(160, 100, 255, .55); }
  7% { box-shadow: 0 0 0 1px #8f5cff33, 0 0 14px -8px var(--bolt-glow), inset 0 0 20px -14px rgba(130, 70, 255, .2); }
  9% { box-shadow: 0 0 0 1px #d8bfff, 0 0 52px 0 var(--bolt-glow), inset 0 0 56px -6px rgba(170, 110, 255, .6); }
  14% { box-shadow: 0 0 0 1px #8f5cff55, 0 0 26px -6px var(--bolt-glow), inset 0 0 38px -12px rgba(130, 70, 255, .35); }
  61% { box-shadow: 0 0 0 1px #8f5cff55, 0 0 30px -6px var(--bolt-glow), inset 0 0 40px -12px rgba(130, 70, 255, .4); }
  62% { box-shadow: 0 0 0 1px #c9a6ff, 0 0 40px -2px var(--bolt-glow), inset 0 0 46px -8px rgba(160, 100, 255, .5); }
  64% { box-shadow: 0 0 0 1px #8f5cff55, 0 0 26px -6px var(--bolt-glow), inset 0 0 38px -12px rgba(130, 70, 255, .35); }
}
@keyframes storm-title { 0%, 100% { opacity: 1; } 31% { opacity: 1; } 31.5% { opacity: .55; } 32% { opacity: 1; } 32.6% { opacity: .7; } 33% { opacity: 1; } 78% { opacity: 1; transform: none; } 78.4% { opacity: .6; transform: translateX(1px); } 78.8% { opacity: 1; transform: none; } }

/* ---------- saving ---------- */
function changed(immediate) {
  dirty = true; setStatus("Unsaved changes");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, immediate ? 300 : 2500);
}
async function save() {
  if (!dirty || saving) { if (saving) saveTimer = setTimeout(save, 1500); return; }
  if (!artifactNS) { setStatus("!Saving isn't available in this view"); return; }
  saving = true; dirty = false; setStatus("Saving…");
  const files = { "sheet.json": { content: JSON.stringify(S, null, 1), contentType: "application/json" } };
  const sentArt = Object.keys(pending);
  for (const p of sentArt) files[p] = pending[p];
  for (const p of removed) files[p] = null;
  const sentRemoved = [...removed];
  try {
    await artifactNS.publish(files);
    sentArt.forEach(p => delete pending[p]); sentRemoved.forEach(p => removed.delete(p));
    setStatus(dirty ? "Unsaved changes" : "Saved");
  } catch (e) {
    dirty = true;
    const c = e && e.code;
    if (c === "conflict") setStatus("A newer version was saved elsewhere. Reloading…");
    else if (["not_writer","not_granted","consent_required","capability_disabled","capability_removed","not_declared"].includes(c)) { canSave = false; editing = false; setStatus("!View only. You can't save changes here"); render(); }
    else if (c === "rate_limited") { setStatus("Saving a bit later…"); saveTimer = setTimeout(save, 8000); }
    else if (c === "too_large") setStatus("!Too large to save. Remove an image or two and try again");
    else setStatus("!Couldn't save. Will retry on your next change");
  } finally { saving = false; if (dirty && !status.startsWith("!") && status !== "Saving a bit later…") { clearTimeout(saveTimer); saveTimer = setTimeout(save, 2500); } }
}
window.addEventListener("beforeunload", e => { if (dirty || saving) e.preventDefault(); });

app.addEventListener("input", e => {

  if (el.isContentEditable) v = el.innerText.replace(/\n$/, "");
  else if (el.type === "checkbox") v = el.checked;
  else if (el.hasAttribute("data-num")) v = el.value === "" ? null : Number(el.value);
  else v = el.value;
  setP(el.dataset.p, v);
  refreshCalc();
  if (el.dataset.p.startsWith("sheet.race") || el.dataset.p.startsWith("sheet.classLevel") || el.dataset.p.startsWith("sheet.subclass")) {
    const w = app.querySelector(".brand .what"); if (w) w.textContent = [S.sheet.race, S.sheet.classLevel, S.sheet.subclass].filter(Boolean).join(" · ");
  }

});

app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");

  if (act === "rest") {
    const kind = b.dataset.kind;

  if (act === "pip") { const i = +b.dataset.i, used = getP(p) || 0, next = i < used ? i : i + 1; setP(p, next); if (next > used && /^Starlight Step/.test(getP(p.replace(/\.used$/, ""))?.name || "")) stepFlash(); render(); changed(); return; }
  if (act === "ring") { toggleRing(); render(); changed(true); return; }

  if (act === "del") { getP(p).splice(+b.dataset.i, 1); render(); changed(); return; }
  if (act === "delart") { const [a] = S.character.art.splice(+b.dataset.i, 1); if (pending[a.path]) delete pending[a.path]; else removed.add(a.path); render(); changed(true); return; }
});

function searchAll(q) {
  const norm = x => (x || "").toLowerCase().replace(/[’'`]/g, "");
  q = norm(q.trim()); if (q.length < 2) return [];
  const out = [], add = (title, where, text, tab, target, extra = {}) => {
    text = (text || "").replace(/[’'`]/g, "");
    const t = norm(title), body = text.toLowerCase();
    const inTitle = t.includes(q), at = body.indexOf(q);
    if (!inTitle && at < 0) return;
    let snip = "";
    if (at >= 0) { const st = Math.max(0, at - 40); snip = (st ? "…" : "") + text.slice(st, at + q.length + 60).replace(/\s+/g, " ") + (at + q.length + 60 < text.length ? "…" : ""); }
    out.push({ title, where, snip, tab, target, score: inTitle ? (t.startsWith(q) ? 0 : 1) : 2, ...extra });
  };
  S.features.forEach((g, gi) => g.items.forEach((it, ii) => add(it.name, `Features & Traits · ${g.title}`, it.text + " " + (it.uses || ""), "features", `feat-${gi}-${ii}`)));
  Object.entries(S.spells.list).forEach(([L, list]) => list.forEach((sp, i) => add(sp.name, `Spells · ${LVL[L]}`, [sp.text, sp.tag, sp.castingTime, sp.range].join(" "), "spells", `spell-${L}-${i}`, { spell: L })));
  S.equipment.items.forEach((it, i) => add(it.name, "Equipment", it.notes, "equipment", `eq-${i}`));
  S.notes.forEach((n, i) => add(n.title, "Campaign Notes", n.text, "notes", `note-${i}`));
  const sh = S.sheet;
  sh.attacks.forEach(a => add(a.name, "Character Sheet · Attacks", a.damage, "sheet", "sec-attacks"));
  add("Attack notes", "Character Sheet · Attacks", sh.attackNotes, "sheet", "sec-attacks");
  add("Defenses & Senses", "Character Sheet", sh.defenses, "sheet", "sec-defenses");
  add("Proficiencies & Languages", "Character Sheet", sh.proficiencies, "sheet", "sec-proficiencies");
  [["personality","Personality Traits"],["ideals","Ideals"],["bonds","Bonds"],["flaws","Flaws"]].forEach(([k, n]) => add(n, "Character Sheet", sh[k], "sheet", "sec-" + k));
  add("Spell materials", "Equipment", S.equipment.components, "equipment", "sec-components");
  add("Other holdings", "Equipment", S.equipment.notes, "equipment", "sec-holdings");
  (S.world?.sections || []).forEach((x, i) => add(x.title, "The World", x.text, "world", `world-${i}`));
  [["appearance","Appearance"],["backstory","Backstory"],["allies","Allies & Organizations"]].forEach(([k, n]) => add(n, "Appearance & Art", S.character[k], "appearance", "sec-" + k));
  return out.sort((a, b) => a.score - b.score).slice(0, 12);
}
function showResults() {
  const box = document.getElementById("search-results"); if (!box) return;
  const res = searchAll(ui.q || "");
  if (!(ui.q || "").trim() || (ui.q || "").trim().length < 2) { box.hidden = true; return; }
  box.innerHTML = res.length ? res.map(r => `<button class="result" role="option" data-act="goto" data-tab="${r.tab}" data-target="${r.target}"${r.spell ? ` data-l="${r.spell}"` : ""}><span class="r-title">${esc(r.title)}</span><span class="r-where">${esc(r.where)}</span>${r.snip ? `<span class="r-snip">${esc(r.snip)}</span>` : ""}</button>`).join("") : `<div class="r-none">Nothing matches "${esc(ui.q.trim())}".</div>`;
  box.hidden = false;
}
function goTo(tab, target, level) {
  ui.tab = tab; if (level) ui.spell = level; ui.q = "";
  try { localStorage.setItem("tab", ui.tab); if (level) localStorage.setItem("spell", level); } catch (x) {}
  render();
  const el = document.getElementById(target);
  if (el) {
    el.scrollIntoView({ block: "center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    el.classList.remove("found"); void el.offsetWidth; el.classList.add("found");
    setTimeout(() => el.classList.remove("found"), 2400);
  }
}
document.addEventListener("click", e => { if (!e.target.closest(".search")) { const b = document.getElementById("search-results"); if (b) b.hidden = true; } });
function applyHp(kind, amt) {
  if (!amt || amt < 0 || isNaN(amt)) return;

  if (kind === "dmg") {

function shrink(file) {

    };

}

/* ---------- cobblestone ground ---------- */
function paintCobbles() {
  try {
    const W = 1536, H = 1152, GX = 24, GY = 18, cell = W / GX, c = document.createElement("canvas");
    c.width = W; c.height = H;

    for (let py = 0; py < H; py++) for (let px = 0; px < W; px++) {
      const ci = Math.floor(px / cell), cj = Math.floor(py / cell);
      let f1 = 1e9, f2 = 1e9, b1 = 0, b2 = 0;
      for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
        const ui2 = ci + di, uj = cj + dj, ii = (ui2 + GX) % GX, jj = (uj + GY) % GY, q = pts[jj * GX + ii];
        const qx = q.x + (ui2 < 0 ? -W : ui2 >= GX ? W : 0), qy = q.y + (uj < 0 ? -H : uj >= GY ? H : 0);
        const dist = Math.hypot(px - qx, py - qy), idx = jj * GX + ii;
        if (dist < f1) { f2 = f1; b2 = b1; f1 = dist; b1 = idx; } else if (dist < f2) { f2 = dist; b2 = idx; }
      }

      let r, g, bl;
      if (edge < 2.2) { r = 11; g = 10; bl = 14; }
      else {
        const base = 28 + pts[b1].t * 16 + n, bevel = Math.min(1, (edge - 2.2) / 7);
        r = base * (.55 + .45 * bevel); g = (base - 2) * (.55 + .45 * bevel); bl = (base + 7) * (.55 + .45 * bevel);

    }
    ctx.putImageData(img, 0, 0);

    const zig = (a, b, rough) => {
      let ps = [a, b];

        const nx = [ps[0]];

          const p0 = ps[i - 1], q = ps[i], len = Math.hypot(q.x - p0.x, q.y - p0.y), off = (rnd() - .5) * len * rough;

    };

      const a = { x: rnd() * W, y: rnd() * H }, ang = rnd() * Math.PI * 2, len = 260 + rnd() * 260;
      const main = zig(a, { x: a.x + Math.cos(ang) * len, y: a.y + Math.sin(ang) * len }, .42);
      bolts.push([main, 1]);
      const nb = 2 + Math.floor(rnd() * 3);
      for (let j = 0; j < nb; j++) {
        const from = main[Math.floor((.15 + rnd() * .7) * main.length)], ba = ang + (rnd() - .5) * 1.8, bl2 = 50 + rnd() * 110;
        const br = zig(from, { x: from.x + Math.cos(ba) * bl2, y: from.y + Math.sin(ba) * bl2 }, .5);
        bolts.push([br, .55]);
        if (rnd() < .5) { const f2 = br[Math.floor(br.length * .5)], ca = ba + (rnd() - .5) * 1.6; bolts.push([zig(f2, { x: f2.x + Math.cos(ca) * 40, y: f2.y + Math.sin(ca) * 40 }, .5), .35]); }
      }
    }

    const passes = [[7, "rgba(120,60,255,.10)", 18], [2.6, "rgba(160,110,255,.28)", 8], [1, "rgba(230,215,255,.55)", 0]];
    for (const [w, col, blur] of passes) for (const [ps, sc] of bolts) for (const ox of [-W, 0, W]) for (const oy of [-H, 0, H]) {
      ctx.beginPath(); ps.forEach((q, i) => i ? ctx.lineTo(q.x + ox, q.y + oy) : ctx.moveTo(q.x + ox, q.y + oy));

/* ---------- the Storm: occasional violet bolts that strike the boxes ---------- */
function startStorm() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = document.createElement("canvas"); cv.className = "storm"; cv.setAttribute("aria-hidden", "true");
  document.body.appendChild(cv);

  const size = () => { const r = window.devicePixelRatio || 1; cv.width = innerWidth * r; cv.height = innerHeight * r; ctx.setTransform(r, 0, 0, r, 0, 0); };
  size(); addEventListener("resize", size);

  function path(a, b, rough) {
    let pts = [a, b];
    for (let lvl = 0; lvl < 6; lvl++) {
      const next = [pts[0]];
      for (let i = 1; i < pts.length; i++) {
        const p = pts[i - 1], q = pts[i], len = Math.hypot(q.x - p.x, q.y - p.y);
        const nx = -(q.y - p.y) / (len || 1), ny = (q.x - p.x) / (len || 1), off = (Math.random() - .5) * len * rough;
        next.push({ x: (p.x + q.x) / 2 + nx * off, y: (p.y + q.y) / 2 + ny * off }, q);
      }
      pts = next;
    }
    return pts;
  }
  function onEdge(r) {
    const side = Math.floor(Math.random() * 4);
    if (side === 0) return { x: rand(r.left, r.right), y: r.top };
    if (side === 1) return { x: r.right, y: rand(r.top, r.bottom) };
    if (side === 2) return { x: rand(r.left, r.right), y: r.bottom };
    return { x: r.left, y: rand(r.top, r.bottom) };
  }
  function draw(paths, a, upto = 1, sky = 0) {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    if (a <= 0) return;
    if (sky > 0) { ctx.fillStyle = `rgba(150,100,255,${sky})`; ctx.fillRect(0, 0, innerWidth, innerHeight); }
    ctx.lineJoin = "round"; ctx.lineCap = "round";
    for (const [pts, w] of paths) {
      const n = Math.max(2, Math.ceil(pts.length * upto));
      ctx.beginPath(); pts.slice(0, n).forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
      ctx.shadowColor = "#9b5cff"; ctx.shadowBlur = 22;
      ctx.strokeStyle = `rgba(160,110,255,${.45 * a})`; ctx.lineWidth = 5 * w; ctx.stroke();
      ctx.shadowBlur = 8;
      ctx.strokeStyle = `rgba(242,232,255,${a})`; ctx.lineWidth = 1.4 * w; ctx.stroke();
    }
    ctx.shadowBlur = 0;
  }

    setTimeout(strike, ringLvl > .5 ? rand(450, 1100) : rand(4000, 9000));
    if (document.hidden) return;
    const vis = [...app.querySelectorAll(".box, .ab, .vital, .card, .qt, .pill-row, .coin, .feat, .note")].filter(el => {
      const r = el.getBoundingClientRect(); return r.width > 30 && r.bottom > 20 && r.top < innerHeight - 20 && r.right > 0 && r.left < innerWidth;
    });
    if (!vis.length) return;
    const target = vis[Math.floor(Math.random() * vis.length)], tr = target.getBoundingClientRect(), end = onEdge(tr);
    let start, other = null;
    if (vis.length > 1 && Math.random() < .5) {
      other = vis[Math.floor(Math.random() * vis.length)];
      if (other === target) other = null;
    }
    if (other) start = onEdge(other.getBoundingClientRect());
    else { const ang = rand(0, Math.PI * 2), dist = rand(140, 320); start = { x: end.x + Math.cos(ang) * dist, y: end.y + Math.sin(ang) * dist }; }
    const fork = () => {
      const main = path(start, end, .45), out = [[main, 1]];
      for (let k = 0; k < 3; k++) {
        const from = main[Math.floor(rand(.2, .8) * main.length)], ang = rand(0, Math.PI * 2), len = rand(25, 70);
        out.push([path(from, { x: from.x + Math.cos(ang) * len, y: from.y + Math.sin(ang) * len }, .5), .55]);
      }
      return out;
    };
    const first = fork(), second = fork(), third = Math.random() < .55 ? fork() : null;
    target.classList.remove("zap"); void target.offsetWidth; target.classList.add("zap");
    if (other) { other.classList.remove("zap"); void other.offsetWidth; other.classList.add("zap"); }
    setTimeout(() => { target.classList.remove("zap"); other && other.classList.remove("zap"); }, 700);

    const t0 = performance.now();
    let done = false;
    setTimeout(() => { done = true; ctx.clearRect(0, 0, innerWidth, innerHeight); }, 450);

      if (done) return;
      const t = now - t0;
      if (t < 60) draw(first, .55, t / 60);
      else if (t < 110) draw(first, 1, 1, .07);
      else if (t < 170) draw(first, 0);
      else if (t < 215) draw(second, .9, 1, .04);
      else if (t < 265) draw(second, 0);
      else if (third && t < 295) draw(third, .6, 1, .02);
      else if (t < 380) { draw(third || second, Math.max(0, .25 - (t - 295) / 340)); }

/* ---------- saving when run locally with server.py (no Claude needed) ---------- */
async function localSaver() {
  try {
    const r = await fetch("api/ping", { cache: "no-store" });
    if (!r.ok || !(await r.json()).ok) return null;
  } catch (e) { return null; }
  const toBase64 = blob => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(",")[1]); fr.onerror = rej; fr.readAsDataURL(blob); });
  return {
    async publish(files) {
      const body = { text: {}, binary: {}, remove: [] };
      for (const [path, v] of Object.entries(files)) {
        if (v === null) body.remove.push(path);
        else if (v instanceof Blob) body.binary[path] = await toBase64(v);
        else if (typeof v === "object" && v.content instanceof Blob) body.binary[path] = await toBase64(v.content);
        else body.text[path] = typeof v === "string" ? v : v.content;
      }
      let r;
      try { r = await fetch("api/save", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }); }
      catch (e) { throw { code: "upstream_error", message: "The local server isn't running." }; }
      if (!r.ok) throw { code: r.status === 413 ? "too_large" : "upstream_error", message: await r.text() };
      return { version: String(Date.now()) };
    }
  };
}

/* ---------- the Storm's section: lightning that crawls along the box and reaches out of it ---------- */
function startStormBox() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const M = 26;
  let crawlers = [], tendrils = [], arcs = [], surge = 0, last = 0;
  const jag = (x, y, ang, len) => {
    const pts = [{ x, y }];
    let d = 0;
    while (d < len) { const step = 5 + Math.random() * 7; ang += (Math.random() - .5) * 1.3; x += Math.cos(ang) * step; y += Math.sin(ang) * step; d += step; pts.push({ x, y }); }
    return pts;
  };
  const bolt = (a, b, rough) => {
    let pts = [a, b];
    for (let lvl = 0; lvl < 5; lvl++) {
      const next = [pts[0]];
      for (let i = 1; i < pts.length; i++) {
        const p = pts[i - 1], q = pts[i], len = Math.hypot(q.x - p.x, q.y - p.y) || 1, off = (Math.random() - .5) * len * rough;
        next.push({ x: (p.x + q.x) / 2 - (q.y - p.y) / len * off, y: (p.y + q.y) / 2 + (q.x - p.x) / len * off }, q);
      }

    }
    return pts;
  };

    ctx.shadowColor = "#9b5cff"; ctx.shadowBlur = 14; ctx.strokeStyle = `rgba(150,90,255,${.4 * a})`; ctx.lineWidth = 4.5 * w; ctx.stroke();
    ctx.shadowBlur = 6; ctx.strokeStyle = `rgba(238,226,255,${a})`; ctx.lineWidth = 1.2 * w; ctx.stroke();
  };

    requestAnimationFrame(frame);
    if (now - last < 33) return;
    last = now;
    const cv = app.querySelector(".sb-canvas");
    if (!cv || document.hidden) return;

    if (rect.bottom < -M || rect.top > innerHeight + M) return;

    };

    // crawlers: jittering lightning that creeps along the border, stalls and reverses
    for (const c of crawlers) {
      c.s += c.v * .033;
      if (Math.random() < .012) c.v *= -1;
      if (Math.random() < .015) c.v = (c.v < 0 ? -1 : 1) * (20 + Math.random() * 180);
      if (Math.random() < .22) continue;

      for (let k = 0; k <= n; k++) {

        pts.push({ x: p.x + p.nx * j + (Math.random() - .5) * 3, y: p.y + p.ny * j + (Math.random() - .5) * 3 });
      }
      stroke(ctx, pts, .45 + Math.random() * .55, 1);

      const t = now - surge;
      if (t > 260) surge = 0;
      else if (t < 60 || (t > 120 && t < 170) || (t > 210 && t < 240)) {
        // real forked bolts along each edge, broken into pieces, instead of one wobbly outline
        const corners = [[0, 0, W, 0, 0, 1], [W, 0, W, H, -1, 0], [W, H, 0, H, 0, -1], [0, H, 0, 0, 1, 0]];
        for (const [x1, y1, x2, y2, nx, ny] of corners) {

            const a = { x: x1 + (x2 - x1) * f, y: y1 + (y2 - y1) * f }, b = { x: x1 + (x2 - x1) * g, y: y1 + (y2 - y1) * g };

      if (Math.random() < .35) continue;
      const len = Math.hypot(r.b.x - r.a.x, r.b.y - r.a.y), n = Math.max(8, Math.round(len / 14)), pts = [];
      for (let k = 0; k <= n; k++) { const f = k / n, off = (Math.random() - .5) * 26 * Math.sin(Math.PI * f); pts.push({ x: r.a.x + (r.b.x - r.a.x) * f - (r.b.y - r.a.y) / len * off, y: r.a.y + (r.b.y - r.a.y) * f + (r.b.x - r.a.x) / len * off }); }
      stroke(ctx, pts, .32 * (1 - (now - r.born) / 300), .8);
    }
    // tendrils: brief fingers that reach into the box or claw out of it
    if (Math.random() < .14) {
      const p = at(Math.random() * P), out = Math.random() < .4 ? -1 : 1;
      tendrils.push({ x: p.x, y: p.y, ang: Math.atan2(p.ny * out, p.nx * out) + (Math.random() - .5) * 1.1, len: 20 + Math.random() * 75, born: now, life: 140 + Math.random() * 380 });
    }
    tendrils = tendrils.filter(t => now - t.born < t.life);
    for (const t of tendrils) {
      if (Math.random() < .3) continue;
      const fade = 1 - (now - t.born) / t.life, pts = jag(t.x, t.y, t.ang, t.len);
      stroke(ctx, pts, fade * .9, .8);
      if (Math.random() < .55) { const b = pts[Math.floor(pts.length * .5)]; stroke(ctx, jag(b.x, b.y, t.ang + (Math.random() - .5) * 1.8, t.len * .45), fade * .6, .55); }
    }
    ctx.shadowBlur = 0;
  }
  requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
(async () => {
  try {
    const r = await fetch("sheet.json", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    S = await r.json();
    render();
    paintCobbles();
    startStorm();
    startStormBox();
    startRingStorm();
  } catch (e) {
    app.querySelector(".main").innerHTML = location.protocol === "file:"
      ? `<p class="loading">This page needs its little server to load Fernrel's data. In this folder, run <code>python3 server.py</code>, then open http://localhost:8000.</p>`
      : `<p class="loading">The character data didn't load. Refresh the page to try again.</p>`;
    return;
  }
  try {
    artifactNS = window.claude && window.claude.use ? await window.claude.use("artifact") : null;
  } catch (e) { artifactNS = null; }
  if (!artifactNS) artifactNS = await localSaver();
  if (!artifactNS) { canSave = false; render(); }
})();
})();
</script>
